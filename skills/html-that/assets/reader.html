<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title><!-- HTML_THAT_TITLE --></title>
  <style>
    :root {
      --background: #f7f5f0;
      --foreground: #252421;
      --muted: #68645d;
      --link: #145f82;
      --rule: #d8d3c9;
      --code-background: #ebe7de;
      --quote: #777168;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      color: var(--foreground);
      background: var(--background);
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: #1d1d1b;
        --foreground: #e5e1d8;
        --muted: #aaa59b;
        --link: #8bc7e3;
        --rule: #45433e;
        --code-background: #2a2926;
        --quote: #aaa59b;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--background);
      color: var(--foreground);
    }

    main {
      width: min(100% - 2.5rem, 43rem);
      margin: 0 auto;
      padding: clamp(3rem, 9vw, 7rem) 0;
    }

    article {
      font-size: clamp(1.08rem, 0.98rem + 0.35vw, 1.24rem);
      line-height: 1.72;
      overflow-wrap: break-word;
    }

    h1, h2, h3, h4, h5, h6 {
      margin: 2.1em 0 0.65em;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.2;
      letter-spacing: -0.018em;
    }

    h1:first-child, h2:first-child, h3:first-child, p:first-child { margin-top: 0; }
    h1 { font-size: 2em; }
    h2 { font-size: 1.5em; }
    h3 { font-size: 1.2em; }
    p, ul, ol, blockquote, pre, table { margin: 0 0 1.25em; }
    li + li { margin-top: 0.35em; }
    a { color: var(--link); text-underline-offset: 0.15em; }
    strong { font-weight: 700; }

    blockquote {
      margin-left: 0;
      padding-left: 1.15rem;
      border-left: 0.2rem solid var(--rule);
      color: var(--quote);
    }

    code, pre {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.88em;
    }

    code {
      padding: 0.12em 0.32em;
      border-radius: 0.25rem;
      background: var(--code-background);
    }

    pre {
      overflow-x: auto;
      padding: 1rem 1.1rem;
      border: 1px solid var(--rule);
      border-radius: 0.45rem;
      background: var(--code-background);
      line-height: 1.55;
    }

    pre code { padding: 0; background: transparent; }

    pre.mermaid {
      display: flex;
      justify-content: center;
      overflow-x: auto;
      padding: 1.25rem;
      background: transparent;
    }

    pre.mermaid[data-processed="true"] {
      border: 0;
    }

    pre.mermaid svg {
      max-width: 100%;
      height: auto;
    }
    hr { margin: 2.2rem 0; border: 0; border-top: 1px solid var(--rule); }

    table {
      display: block;
      width: max-content;
      max-width: 100%;
      overflow-x: auto;
      border-collapse: collapse;
      font-size: 0.92em;
    }

    th, td {
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--rule);
      text-align: left;
      vertical-align: top;
    }

    th {
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-weight: 650;
    }

    .question {
      margin: 0 0 2.6rem;
      padding: 0 0 1.4rem;
      border-bottom: 1px solid var(--rule);
      color: var(--muted);
    }

    .repository {
      margin: 0 0 1.5rem;
      color: var(--muted);
      font-size: 0.82em;
      line-height: 1.45;
    }

    .repository code { font-size: 0.95em; }

    .question p:last-child { margin-bottom: 0; }
    .answer > :last-child { margin-bottom: 0; }

    .section-label {
      margin: 0 0 0.45rem;
      color: var(--muted);
      font-size: 0.72em;
      font-weight: 700;
      letter-spacing: 0.1em;
      line-height: 1.2;
      text-transform: uppercase;
    }

    @media print {
      :root { --background: #fff; --foreground: #000; --link: #000; }
      main { width: 100%; padding: 0; }
      a { text-decoration: none; }
    }
  </style>
</head>
<body>
  <main>
    <article>
      <!-- HTML_THAT_CONTENT -->
    </article>
  </main>
  <script src="./mermaid.min.js"></script>
  <script>
    mermaid.initialize({
      startOnLoad: true,
      securityLevel: "strict",
      htmlLabels: false,
      theme: window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "default"
    });
  </script>
</body>
</html>
